	<style>
		* {
			margin: 0;
			padding: 0;
		}
	</style>
	<script>
		var assetPath = "./pages/instrument/utilities/images/"
		const svgFiles  = ["wholeNote.svg", "gClef.svg"];
		const canvas = document.querySelector("#musicCanvas");
		const context2D = canvas.getContext("2d");
		window.addEventListener('resize', resizeScreenElements);
		context2D.scale(1, 1);
		var imageAssets = [];
		const imageAssetSize = 2;
		function checkCompatibility(context2D) {
			if (context2D === null) {
				alert("Unable to initialize WebGL. Your browser or machine may not support it.");
				return;
			}
		}
		function resizeScreenElements() {
			width = window.innerWidth;
			height = window.innerHeight;
			canvas.style.width = (window.innerWidth) + 'px';
			canvas.style.height = (window.innerHeight) + 'px';
		}
		function setBackground(context){
			//context.clearColor(0.8, 0.8, 0.8, 1.0);
			//context.clear(context.COLOR_BUFFER_BIT);
		}
		function drawSVGImagesOnContext(context, svgFileNames){
			const imagePromises = svgFileNames.map((fileName) => {
				return new Promise((resolve, reject) => {
					const img = new Image();
					img.onload = () => {
						resolve(img);
					};
					img.onerror = (error) => {
						reject(error);
					};
					img.src = assetPath + fileName;
				});
			});
			Promise.all(imagePromises)
			.then((images) => {
				images.forEach((img) => {
					//context.clearRect(0, 0, context.canvas.width, context.canvas.height);
					context.drawImage(img, 0, 0, img.width, img.height);
				});
			})
			.catch((error) => {
				console.error('Error loading SVG images:', error);
			});
		}
		function loadAssets(context){
			svgFiles.forEach(function (currentImageName, i) {
				var currentImage = new Image();
				currentImage.src = assetPath + currentImageName;
				currentImage.onload = function() {
					console.log(currentImage.src + " loaded");
					imageAssets.push(currentImage);
					console.log("All images loaded");
					draw(context, currentImage);
				}
			});
		}
		function draw(context, currentImage){
			console.log(currentImage.width, currentImage.height);
			var width = currentImage.width;
			var height = currentImage.height;
			context.drawImage(currentImage, 0, 0, width, height, 0, 0, width, height);
		}
		function main() {
			checkCompatibility(context2D);
			resizeScreenElements(context2D);
			setBackground(context2D);
			drawSVGImagesOnContext(context2D, svgFiles);
			//loadAssets(context2D);
		}
		window.onload = main;
	</script>
