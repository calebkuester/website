		<canvas id="musicCanvas" defer="defer"></canvas>

	<footer></footer>
	<style>
		* {
			margin: 0;
			padding: 0;
		}
		body, html {
			height:100%;
		}
		#musicCanvas {
			position:absolute;
			height:100%; width:100%;
		}
	</style>
	<script>
		//
		// start here
		//
		const canvas = document.querySelector("#musicCanvas");
		window.onresize = resizeScreenElements;
		//const webglContext = canvas.getContext("webgl");
		const twoDContext = canvas.getContext("2d");
		const imageAssetNames = ["wholeNote.svg", "gClef.svg"];
		var imageAssets = [];
		const imageAssetSize = 2;
		function checkCompatibility(context) {
			if (context === null) {
				alert("Unable to initialize WebGL. Your browser or machine may not support it.");
				return;
			}
		}
		function resizeScreenElements() {
			//console.log(window.innerHeight);
			//console.log(window.innerWidth);
			//canvas.style.width = (window.innerWidth) + 'px';
			//canvas.style.height = (window.innerHeight) + 'px';
		}
		function setBackground(context){
			//context.clearColor(0.8, 0.8, 0.8, 1.0);
			//context.clear(context.COLOR_BUFFER_BIT);
		}
		function loadAssets(context){
			var assetPath = "./utilities/images/"
			imageAssetNames.forEach(function (currentImageName, i) {
				var currentImage = new Image();
				currentImage.src = assetPath + currentImageName;
				currentImage.onload = function() {
					console.log(currentImage.src + " loaded");
					imageAssets.push(currentImage);
					if(currentImageName === imageAssetNames[imageAssetNames.length - 1]){
						console.log("All images loaded");
						draw(context);
					}
				}
			});
		}
		function draw(context){
			imageAssets[1].setAttribute("width", 200);
			imageAssets[1].setAttribute("height", 200);
			context.drawImage(imageAssets[1], 0, 0);
		}
		function main() {
			checkCompatibility(twoDContext);
			
			// while(imageAssets.length < imageAssetSize){
			// 	console.log("loading " + imageAssets.length + " of " + imageAssetSize);
			// }
			setBackground(twoDContext);
			loadAssets(twoDContext);
		}
		window.onload = main;
	</script>
