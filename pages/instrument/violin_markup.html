	<script>
		var assetPath = "./pages/instrument/utilities/images/"
		const svgFiles  = ["wholeNote.svg", "gClef.svg", "violin-finger-positions.png"];
		function loadSVGImages(svgFileNames){
			const imagePromises = svgFileNames.map((fileName) => {
				return new Promise((resolve, reject) => {
					const img = new Image();
					img.onload = () => {
						resolve(img);
					};
					img.onerror = (error) => {
						reject(error);
					};
					img.src = assetPath + fileName;
				});
			});
			Promise.all(imagePromises)
			.then((images) => {
				images.forEach((img) => {
					//context.drawImage(img, 0, 0, img.width, img.height);
					console.log('loaded ' + img.src);
				});
			})
			.catch((error) => {
				console.error('Error loading SVG images:', error);
			});
		}
		function resize(){
			var fingerPositionsMeasurements = document.getElementById('fingerPositions').getBoundingClientRect();
			var musicsheet = document.getElementById('musicSheet').style.marginLeft = fingerPositionsMeasurements.width + 'px';
			resizeFingerPositionElements(fingerPositionsMeasurements);
		}
		function main() {
			var song = './pages/instrument/FrogsTheme.mid';
			window.addEventListener('resize', resize);
			loadSVGImages(svgFiles);
			resize();
			loadData(song);
			
		}
		window.onload = main;
	</script>
